<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
  <defs>
    <pattern id="topo" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="56" fill="none" stroke="#0b1220" stroke-width="0.6" opacity="0.10"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#0b1220" stroke-width="0.6" opacity="0.10"/>
      <circle cx="60" cy="60" r="28" fill="none" stroke="#0b1220" stroke-width="0.6" opacity="0.10"/>
      <circle cx="60" cy="60" r="14" fill="none" stroke="#0b1220" stroke-width="0.6" opacity="0.10"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#f6f3ec" opacity="0.18"/>
    </pattern>
    <linearGradient id="darkfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a1a33"/>
    </linearGradient>
  </defs>

  <!-- parchment background -->
  <rect width="1200" height="1200" fill="#f6f3ec"/>
  <rect width="1200" height="1200" fill="url(#topo)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="78" fill="#0b1220"/>
  <text x="60" y="50" fill="#f6f3ec" font-size="22" letter-spacing="2" font-family="Georgia, serif">MULTIMODAL WORKS<tspan font-size="14" fill="#f6f3ec" opacity="0.55" dx="14" letter-spacing="4">LLC</tspan></text>
  <!-- mini flag -->
  <g transform="translate(1050 28)">
    <rect width="100" height="52" fill="#ffffff" stroke="#0b1220" stroke-opacity="0.2"/>
    <g fill="#b31942">
      <rect y="0" width="100" height="4"/>
      <rect y="8" width="100" height="4"/>
      <rect y="16" width="100" height="4"/>
      <rect y="24" width="100" height="4"/>
      <rect y="32" width="100" height="4"/>
      <rect y="40" width="100" height="4"/>
      <rect y="48" width="100" height="4"/>
    </g>
    <rect width="40" height="28" fill="#0a3161"/>
  </g>

  <!-- KICKER -->
  <text x="60" y="170" fill="#b31942" font-size="20" letter-spacing="5" font-family="Helvetica, Arial, sans-serif">NOW TAKING ENGAGEMENTS &#183; SMB AI &#183; GREATER CHICAGO</text>

  <!-- HEADLINE -->
  <text x="60" y="280" fill="#0b1220" font-size="90" font-weight="400">Ship production AI</text>
  <text x="60" y="380" fill="#0b1220" font-size="90" font-weight="400">in <tspan font-style="italic">3&#8211;6 months.</tspan></text>

  <!-- SUBHEAD -->
  <text x="60" y="475" fill="#0b1220" opacity="0.78" font-size="26" font-family="Helvetica, Arial, sans-serif">
    <tspan x="60" dy="0">We help small &amp; mid-sized teams stand up retrieval,</tspan>
    <tspan x="60" dy="36">agents, and on&#8209;prem AI &#8212; from notebook to a</tspan>
    <tspan x="60" dy="36">system your team can run, measure, and extend.</tspan>
  </text>

  <!-- Two pillars -->
  <g transform="translate(60 640)">
    <!-- LOCAL AI card -->
    <rect x="0" y="0" width="525" height="240" rx="20" fill="#b31942"/>
    <text x="30" y="55" fill="#f6f3ec" font-size="14" letter-spacing="4" font-family="Helvetica, Arial, sans-serif">WHAT WE SHIP &#183; A</text>
    <text x="30" y="115" fill="#f6f3ec" font-size="44">Local AI</text>
    <text x="30" y="170" fill="#f6f3ec" opacity="0.92" font-size="20" font-family="Helvetica, Arial, sans-serif">
      <tspan x="30" dy="0">On-prem AI workstations &#183; MCP-wired to</tspan>
      <tspan x="30" dy="28">email, drive, code, CRM &#183; flat monthly cost</tspan>
    </text>

    <!-- CLOUD AI card -->
    <g transform="translate(555 0)">
      <rect x="0" y="0" width="525" height="240" rx="20" fill="#0a3161"/>
      <text x="30" y="55" fill="#f6f3ec" font-size="14" letter-spacing="4" font-family="Helvetica, Arial, sans-serif">WHAT WE SHIP &#183; B</text>
      <text x="30" y="115" fill="#f6f3ec" font-size="44">Cloud AI</text>
      <text x="30" y="170" fill="#f6f3ec" opacity="0.92" font-size="20" font-family="Helvetica, Arial, sans-serif">
        <tspan x="30" dy="0">Retrieval, routers, federated search &#183;</tspan>
        <tspan x="30" dy="28">research notebook &#8594; production system</tspan>
      </text>
    </g>
  </g>

  <!-- PROOF strip -->
  <g transform="translate(60 920)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#0b1220" stroke-opacity="0.18" stroke-width="1"/>
    <text x="0" y="50" fill="#0b1220" font-size="22" font-family="Helvetica, Arial, sans-serif" opacity="0.6" letter-spacing="3">TRACK RECORD</text>
    <g font-family="Helvetica, Arial, sans-serif">
      <text x="0" y="105" fill="#0b1220" font-size="40" font-weight="600">+20%</text>
      <text x="0" y="138" fill="#0b1220" opacity="0.7" font-size="18">Recall@10 after retrieval tuning</text>

      <text x="360" y="105" fill="#0b1220" font-size="40" font-weight="600">4 yrs</text>
      <text x="360" y="138" fill="#0b1220" opacity="0.7" font-size="18">Accenture Federal MLE Group</text>

      <text x="720" y="105" fill="#0b1220" font-size="40" font-weight="600">1 wk</text>
      <text x="720" y="138" fill="#0b1220" opacity="0.7" font-size="18">paid scoping sprint to start</text>
    </g>
  </g>

  <!-- FOOTER bar -->
  <rect x="0" y="1090" width="1200" height="110" fill="url(#darkfade)"/>
  <rect x="0" y="1090" width="1200" height="110" fill="url(#dots)"/>

  <text x="60" y="1140" fill="#f6f3ec" font-size="22" font-family="Helvetica, Arial, sans-serif" opacity="0.6" letter-spacing="3">LET&#8217;S TALK</text>
  <text x="60" y="1175" fill="#f6f3ec" font-size="28">Mridul Sarkar &#183; Founder</text>

  <text x="1140" y="1140" fill="#f6f3ec" font-size="20" font-family="Helvetica, Arial, sans-serif" text-anchor="end" opacity="0.7">mridul@multimodalworks.io</text>
  <text x="1140" y="1175" fill="#f6f3ec" font-size="20" font-family="Helvetica, Arial, sans-serif" text-anchor="end">multimodalworks.io</text>
</svg>
